name: Terraform Datadog Monitors (stg)

on:
  push:
    branches: ["stg", "stg-datadog"]
    paths:
      - "terraform/envs/dev/monitors-dev/**"
      - "terraform/modules/datadog-monitors/**"
      - ".github/workflows/tf_monitors_dev.yaml" 
  pull_request:
    branches: ["stg"]
    paths:
      - "terraform/envs/dev/monitors-dev/**"
      - "terraform/modules/datadog-monitors/**"
      - ".github/workflows/tf_monitors_dev.yaml" 
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  GOOGLE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  TF_BUCKET: ${{ secrets.TF_BUCKET }}
  TF_PREFIX: ${{ secrets.TF_PREFIX }}   
  DD_SITE: ${{ secrets.DD_SITE || 'ap1.datadoghq.com' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/dev/monitors-dev  
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (GCS backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="prefix=${TF_PREFIX}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
          TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
          TF_VAR_datadog_api_url: https://api.${{ secrets.DD_SITE || 'ap1.datadoghq.com' }}
        run: terraform plan -no-color -out=tfplan

      - name: Upload plan (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/envs/dev/monitors-dev/tfplan

  apply:
    name: Apply
    needs: [plan]
    if: github.ref == 'refs/heads/stg' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: stg
    defaults:
      run:
        working-directory: terraform/envs/dev/monitors-dev   # <-- change if you use envs/dev
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (GCS backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="prefix=${TF_PREFIX}"

      - name: Terraform apply
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
          TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
          TF_VAR_datadog_api_url: https://api.${{ secrets.DD_SITE || 'ap1.datadoghq.com' }}
        run: terraform apply -auto-approve
